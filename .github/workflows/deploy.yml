name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap lastmod is each page's last commit date.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      # --strict fails the build on broken links / missing nav pages, so a bad
      # page can never reach the live site.
      - run: mkdocs build --strict

      # Production build (push to main / manual): hand the site to Pages.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # PR build: publish the rendered site as a downloadable artifact so changes
      # can be previewed before merge, without deploying anything live.
      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site

  # Deploy only happens on push to main (i.e. after a PR is merged) — never on a PR.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After a merge to main is live: tell IndexNow (Bing, Yandex, Seznam, Naver) which pages changed.
  # Key file: docs/<KEY>.txt (public by design). Never blocks or fails the site deploy.
  indexnow:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit changed pages to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          KEY: f29e86c464448f3fe6c79699afb0e3fb
        run: |
          host=wiki.lokahi.shop
          files=$(git diff --name-only --diff-filter=AMR "$BEFORE" "$GITHUB_SHA" -- 'docs/*.md' || true)
          urls=""
          for f in $files; do
            p=${f#docs/}; p=${p%.md}
            case "$p" in
              index) p="" ;;
              */index) p="${p%index}" ;;
              *) p="$p/" ;;
            esac
            urls="$urls\"https://$host/$p\","
          done
          if [ -z "$urls" ]; then echo "No page changes, nothing to submit."; exit 0; fi
          body="{\"host\":\"$host\",\"key\":\"$KEY\",\"keyLocation\":\"https://$host/$KEY.txt\",\"urlList\":[${urls%,}]}"
          echo "$body"
          curl -sS -w "\nIndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body"
